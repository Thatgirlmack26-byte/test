<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Connect 4</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Connect 4</h1>
    <div class="status" id="status">Player 1 (Red) turn</div>
    <div class="board" id="board">
      <div class="column" data-col="0"></div>
      <div class="column" data-col="1"></div>
      <div class="column" data-col="2"></div>
      <div class="column" data-col="3"></div>
      <div class="column" data-col="4"></div>
      <div class="column" data-col="5"></div>
      <div class="column" data-col="6"></div>
    </div>
    <div class="controls">
      <button id="restart">Restart Round</button>
      <button id="resetScores">Reset Scores</button>
    </div>
    <div class="scores">
      <span>Player 1 (Red): <strong id="scoreX">0</strong></span>
      <span>Player 2 (Yellow): <strong id="scoreO">0</strong></span>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
